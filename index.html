<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>บันทึกซองงานแต่ง (Wedding Envelope Tracker)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            font-family: 'Kanit', sans-serif;
            background-color: #fdf2f8; 
            background-image: radial-gradient(#fbcfe8 1px, transparent 1px);
            background-size: 20px 20px;
        }
        .glass-panel {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.5);
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05), 0 8px 10px -6px rgba(0, 0, 0, 0.01);
        }
        textarea::-webkit-scrollbar, .overflow-y-auto::-webkit-scrollbar { width: 6px; }
        textarea::-webkit-scrollbar-track, .overflow-y-auto::-webkit-scrollbar-track { background: #f1f1f1; border-radius: 4px; }
        textarea::-webkit-scrollbar-thumb, .overflow-y-auto::-webkit-scrollbar-thumb { background: #fbcfe8; border-radius: 4px; }
        @keyframes slideIn { from { transform: translateX(100%); opacity: 0; } to { transform: translateX(0); opacity: 1; } }
        @keyframes fadeOut { from { opacity: 1; } to { opacity: 0; } }
        .toast-enter { animation: slideIn 0.3s ease-out forwards; }
        .toast-exit { animation: fadeOut 0.3s ease-out forwards; }
    </style>
</head>
<body class="text-gray-800 min-h-screen flex flex-col items-center py-6 px-4 sm:px-6 lg:px-8">

    <!-- Header -->
    <div class="text-center mb-6 w-full max-w-lg relative">
        <button onclick="toggleDashboard()" class="absolute top-0 right-0 bg-white/90 hover:bg-white text-pink-600 px-4 py-2 rounded-xl shadow-sm border border-pink-200 text-sm font-medium transition-all flex items-center gap-2">
            <i class="fa-solid fa-chart-pie"></i> สรุปยอด
        </button>
        <h1 class="text-3xl font-semibold text-pink-800 mb-2 flex items-center justify-center gap-2 mt-12 sm:mt-0">
            <i class="fa-solid fa-envelope-open-text"></i> บันทึกซองงานแต่ง
        </h1>
        <p class="text-gray-500 text-sm">ระบบลงทะเบียนหน้างาน เชื่อมต่อ Google Sheets</p>
    </div>

    <!-- Main Form Container -->
    <div class="w-full max-w-lg glass-panel rounded-3xl p-6 sm:p-8 relative">
        <form id="envelopeForm" class="space-y-6">
            <!-- ชื่อ-นามสกุล -->
            <div>
                <label for="guestName" class="block text-sm font-medium text-gray-700 mb-1.5">ชื่อ-นามสกุล หน้าซอง <span class="text-pink-500">*</span></label>
                <div class="relative">
                    <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none"><i class="fa-solid fa-user text-gray-400"></i></div>
                    <input type="text" id="guestName" required autocomplete="off" class="block w-full pl-11 pr-4 py-3.5 border border-gray-200 rounded-2xl focus:ring-pink-500 focus:border-pink-500 text-lg transition-colors bg-gray-50/50" placeholder="กรอกชื่อแขก...">
                </div>
            </div>

            <!-- จำนวนเงิน -->
            <div>
                <label for="amount" class="block text-sm font-medium text-gray-700 mb-1.5">จำนวนเงิน (บาท) <span class="text-pink-500">*</span></label>
                <div class="relative mb-3">
                    <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none"><i class="fa-solid fa-baht-sign text-gray-400"></i></div>
                    <input type="number" id="amount" required min="0" step="1" class="block w-full pl-11 pr-4 py-3.5 border border-gray-200 rounded-2xl focus:ring-pink-500 focus:border-pink-500 text-2xl font-bold text-pink-700 transition-colors bg-gray-50/50" placeholder="0">
                </div>
                <div class="grid grid-cols-5 gap-2 mt-2">
                    <button type="button" onclick="setAmount(500)" class="py-2.5 text-sm font-medium rounded-xl border border-pink-100 bg-white text-gray-600 hover:bg-pink-50 hover:text-pink-700 transition-all shadow-sm">500</button>
                    <button type="button" onclick="setAmount(1000)" class="py-2.5 text-sm font-medium rounded-xl border border-pink-100 bg-white text-gray-600 hover:bg-pink-50 hover:text-pink-700 transition-all shadow-sm">1,000</button>
                    <button type="button" onclick="setAmount(2000)" class="py-2.5 text-sm font-medium rounded-xl border border-pink-100 bg-white text-gray-600 hover:bg-pink-50 hover:text-pink-700 transition-all shadow-sm">2,000</button>
                    <button type="button" onclick="setAmount(3000)" class="py-2.5 text-sm font-medium rounded-xl border border-pink-100 bg-white text-gray-600 hover:bg-pink-50 hover:text-pink-700 transition-all shadow-sm">3,000</button>
                    <button type="button" onclick="setAmount(5000)" class="py-2.5 text-sm font-medium rounded-xl border border-pink-100 bg-white text-gray-600 hover:bg-pink-50 hover:text-pink-700 transition-all shadow-sm">5,000</button>
                </div>
            </div>

            <!-- ประเภท -->
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-2">ประเภทการรับเงิน</label>
                <div class="flex gap-4">
                    <label class="flex-1 cursor-pointer">
                        <input type="radio" name="giftType" value="เงินสด" class="peer sr-only" checked>
                        <div class="text-center py-3 rounded-2xl border-2 border-gray-100 bg-white peer-checked:bg-pink-50 peer-checked:border-pink-500 peer-checked:text-pink-700 transition-all shadow-sm text-gray-600"><i class="fa-solid fa-money-bill-wave mr-2"></i> เงินสด</div>
                    </label>
                    <label class="flex-1 cursor-pointer">
                        <input type="radio" name="giftType" value="โอนเงิน/QR" class="peer sr-only">
                        <div class="text-center py-3 rounded-2xl border-2 border-gray-100 bg-white peer-checked:bg-pink-50 peer-checked:border-pink-500 peer-checked:text-pink-700 transition-all shadow-sm text-gray-600"><i class="fa-solid fa-qrcode mr-2"></i> โอนเงิน</div>
                    </label>
                </div>
            </div>

            <!-- ฝ่าย -->
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-2">แขกฝ่าย <span class="text-pink-500">*</span></label>
                <div class="flex gap-2 sm:gap-3">
                    <label class="flex-1 cursor-pointer">
                        <input type="radio" name="side" value="เจ้าบ่าว" class="peer sr-only">
                        <div class="text-center py-2.5 rounded-xl border border-gray-200 bg-white peer-checked:bg-blue-50 peer-checked:border-blue-400 peer-checked:text-blue-700 transition-all text-sm font-medium text-gray-500"><i class="fa-solid fa-mars mr-1"></i> เจ้าบ่าว</div>
                    </label>
                    <label class="flex-1 cursor-pointer">
                        <input type="radio" name="side" value="เจ้าสาว" class="peer sr-only">
                        <div class="text-center py-2.5 rounded-xl border border-gray-200 bg-white peer-checked:bg-rose-50 peer-checked:border-rose-400 peer-checked:text-rose-700 transition-all text-sm font-medium text-gray-500"><i class="fa-solid fa-venus mr-1"></i> เจ้าสาว</div>
                    </label>
                    <label class="flex-1 cursor-pointer">
                        <input type="radio" name="side" value="ทั้งคู่" class="peer sr-only" checked>
                        <div class="text-center py-2.5 rounded-xl border border-gray-200 bg-white peer-checked:bg-purple-50 peer-checked:border-purple-400 peer-checked:text-purple-700 transition-all text-sm font-medium text-gray-500"><i class="fa-solid fa-people-group mr-1"></i> ทั้งคู่</div>
                    </label>
                </div>
            </div>

            <!-- หมายเหตุ -->
            <div>
                <label for="note" class="block text-sm font-medium text-gray-700 mb-1.5">หมายเหตุ (ถ้ามี)</label>
                <textarea id="note" rows="2" class="block w-full p-4 border border-gray-200 rounded-2xl focus:ring-pink-500 focus:border-pink-500 text-sm transition-colors bg-gray-50/50" placeholder="เช่น มา 2 คน, ฝากซองมา..."></textarea>
            </div>

            <!-- ปุ่มดำเนินการ -->
            <div class="pt-3 flex gap-4">
                <button type="button" onclick="resetForm()" class="px-6 py-4 border-2 border-gray-200 text-gray-600 rounded-2xl hover:bg-gray-50 font-medium transition-colors bg-white">ล้างข้อมูล</button>
                <button type="submit" id="submitBtn" class="flex-1 bg-gradient-to-r from-pink-500 to-rose-500 hover:from-pink-600 hover:to-rose-600 text-white py-4 px-4 rounded-2xl font-medium text-lg shadow-lg hover:shadow-xl transition-all flex items-center justify-center gap-2"><i class="fa-solid fa-paper-plane"></i> บันทึกข้อมูล</button>
            </div>
        </form>
    </div>

    <!-- Dashboard Modal -->
    <div id="dashboardModal" class="fixed inset-0 bg-gray-900/60 hidden z-50 flex items-center justify-center p-4 backdrop-blur-sm transition-opacity">
        <div class="bg-white rounded-3xl shadow-2xl w-full max-w-4xl h-[90vh] flex flex-col overflow-hidden border border-white/20">
            <div class="px-6 py-5 border-b border-pink-100 flex justify-between items-center bg-gradient-to-r from-pink-50 to-white">
                <h3 class="text-xl font-bold text-pink-800"><i class="fa-solid fa-chart-pie mr-2 text-pink-500"></i> สรุปยอดเงินใส่ซอง</h3>
                <button onclick="toggleDashboard()" class="text-gray-400 hover:text-pink-600 transition-colors"><i class="fa-solid fa-times text-2xl"></i></button>
            </div>
            
            <div class="p-4 sm:p-6 overflow-y-auto flex-1 bg-gray-50/50 relative">
                
                <div id="loadingOverlay" class="absolute inset-0 bg-white/80 backdrop-blur-sm z-10 flex flex-col items-center justify-center hidden">
                    <i class="fa-solid fa-circle-notch fa-spin text-4xl text-pink-500 mb-3"></i>
                    <p class="font-medium text-pink-800">กำลังซิงค์ข้อมูลจาก Sheets...</p>
                </div>

                <div class="grid grid-cols-1 sm:grid-cols-3 gap-4 mb-6">
                    <div class="bg-white p-5 rounded-2xl shadow-sm border border-gray-100 flex flex-col items-center justify-center relative overflow-hidden">
                        <div class="absolute top-0 w-full h-1 bg-pink-400"></div>
                        <span class="text-gray-500 text-sm font-medium mb-1">ยอดรวมทั้งหมด</span>
                        <span class="text-3xl font-bold text-pink-600" id="totalAmount">0</span>
                        <span class="text-xs text-gray-400 mt-2 bg-gray-50 px-3 py-1 rounded-full" id="totalCount">0 ซอง</span>
                    </div>
                    <div class="bg-white p-5 rounded-2xl shadow-sm border border-gray-100 flex flex-col items-center justify-center relative overflow-hidden">
                        <div class="absolute top-0 w-full h-1 bg-blue-400"></div>
                        <span class="text-gray-500 text-sm font-medium mb-1"><i class="fa-solid fa-mars text-blue-500 mr-1"></i> ฝ่ายเจ้าบ่าว</span>
                        <span class="text-2xl font-bold text-blue-600" id="groomAmount">0</span>
                        <span class="text-xs text-gray-400 mt-2 bg-gray-50 px-3 py-1 rounded-full" id="groomCount">0 ซอง</span>
                    </div>
                    <div class="bg-white p-5 rounded-2xl shadow-sm border border-gray-100 flex flex-col items-center justify-center relative overflow-hidden">
                        <div class="absolute top-0 w-full h-1 bg-rose-400"></div>
                        <span class="text-gray-500 text-sm font-medium mb-1"><i class="fa-solid fa-venus text-rose-500 mr-1"></i> ฝ่ายเจ้าสาว</span>
                        <span class="text-2xl font-bold text-rose-600" id="brideAmount">0</span>
                        <span class="text-xs text-gray-400 mt-2 bg-gray-50 px-3 py-1 rounded-full" id="brideCount">0 ซอง</span>
                    </div>
                </div>

                <div class="flex justify-between items-center mb-4">
                    <h4 class="font-semibold text-gray-700">รายชื่อที่บันทึกล่าสุด</h4>
                    <button id="refreshBtn" onclick="fetchDashboardData(true)" class="text-xs bg-pink-100 text-pink-600 hover:bg-pink-200 px-3 py-1.5 rounded-xl transition-colors font-medium flex items-center gap-1.5 shadow-sm">
                        <i class="fa-solid fa-rotate"></i> ซิงค์ข้อมูลล่าสุด
                    </button>
                </div>

                <div class="bg-white rounded-2xl shadow-sm border border-gray-100 overflow-hidden">
                    <div class="overflow-x-auto">
                        <table class="w-full text-left text-sm whitespace-nowrap">
                            <thead class="bg-pink-50/50 text-gray-600 border-b border-pink-100">
                                <tr>
                                    <th class="px-5 py-3.5 font-medium">เวลา</th>
                                    <th class="px-5 py-3.5 font-medium">ชื่อ-นามสกุล</th>
                                    <th class="px-5 py-3.5 font-medium text-right">จำนวนเงิน</th>
                                    <th class="px-5 py-3.5 font-medium text-center">ประเภท</th>
                                    <th class="px-5 py-3.5 font-medium text-center">ฝ่าย</th>
                                </tr>
                            </thead>
                            <tbody id="guestListTable" class="divide-y divide-gray-50"></tbody>
                        </table>
                    </div>
                    <div id="emptyState" class="hidden p-12 text-center text-gray-400">
                        <i class="fa-solid fa-envelope-open-text text-5xl mb-4 text-pink-200"></i>
                        <p class="font-medium">ยังไม่มีข้อมูลการบันทึกซอง</p>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Toast Notification -->
    <div id="toastContainer" class="fixed bottom-5 right-5 flex flex-col gap-3 z-50"></div>

    <script>
        // =========================================================
        // 🔴 วาง URL ที่ได้จาก Google Apps Script (Deploy -> New Version) ตรงนี้
        // =========================================================
        const GOOGLE_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbyX4pUBECdqu3n9B5ZiTeQXH66GDToemVHhWkOc2JnQcFUb2TocrmrTbxr8tnDkSYoonw/exec';
        
        const form = document.getElementById('envelopeForm');
        const nameInput = document.getElementById('guestName');
        const amountInput = document.getElementById('amount');
        const submitBtn = document.getElementById('submitBtn');
        const STORAGE_KEY = 'wedding_envelopes_data';

        function setAmount(val) {
            amountInput.value = val;
            document.getElementById('note').focus();
        }

        function resetForm() {
            form.reset();
            document.querySelector('input[name="giftType"][value="เงินสด"]').checked = true;
            document.querySelector('input[name="side"][value="ทั้งคู่"]').checked = true;
            nameInput.focus();
        }

        function showToast(message, type = 'success') {
            const toast = document.createElement('div');
            const icon = type === 'success' ? '<i class="fa-solid fa-circle-check text-green-500 text-2xl"></i>' : '<i class="fa-solid fa-circle-xmark text-red-500 text-2xl"></i>';
            const bgColor = type === 'success' ? 'bg-white' : 'bg-red-50';
            const border = type === 'success' ? 'border-green-200' : 'border-red-200';
            
            toast.className = `flex items-center gap-4 p-4 rounded-2xl shadow-xl border ${border} ${bgColor} toast-enter min-w-[300px] z-50`;
            toast.innerHTML = `${icon}<span class="text-gray-800 font-medium">${message}</span>`;
            
            document.getElementById('toastContainer').appendChild(toast);
            setTimeout(() => {
                toast.classList.remove('toast-enter'); toast.classList.add('toast-exit');
                setTimeout(() => toast.remove(), 300);
            }, 3000);
        }

        // ==========================================
        // 🚀 ระบบ POST (ส่งข้อมูลบันทึกซอง)
        // ==========================================
        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            const guestName = nameInput.value.trim();
            const amount = amountInput.value;
            if(!guestName || !amount) { showToast('กรุณากรอกข้อมูลให้ครบถ้วน', 'error'); return; }

            const originalBtnText = submitBtn.innerHTML;
            submitBtn.innerHTML = '<i class="fa-solid fa-circle-notch fa-spin"></i> กำลังบันทึก...';
            submitBtn.disabled = true;
            submitBtn.classList.add('opacity-75', 'cursor-not-allowed');

            try {
                // จัดโครงสร้าง JSON ส่งแบบเดียวกับผังที่นั่ง
                const payload = {
                    action: 'saveEnvelope',
                    data: {
                        name: guestName,
                        amount: amount,
                        type: document.querySelector('input[name="giftType"]:checked').value,
                        side: document.querySelector('input[name="side"]:checked').value,
                        note: document.getElementById('note').value.trim()
                    }
                };

                // ส่งข้อมูล (ทะลุกำแพงเบราว์เซอร์มือถือด้วย JSON String)
                const response = await fetch(GOOGLE_SCRIPT_URL, {
                    method: 'POST',
                    body: JSON.stringify(payload)
                });
                
                const result = await response.json();
                if(result.result === 'success') {
                    showToast(`บันทึกซองของ ${guestName} สำเร็จ`);
                    resetForm();
                    localStorage.removeItem(STORAGE_KEY); // บังคับให้โหลดข้อมูลใหม่เสมอเมื่อเปิดหน้าสรุปยอด
                } else { throw new Error(result.message); }
            } catch (error) {
                console.error('Save Error:', error);
                showToast('การเชื่อมต่อล้มเหลว กรุณาลองใหม่', 'error');
            } finally {
                submitBtn.innerHTML = originalBtnText;
                submitBtn.disabled = false;
                submitBtn.classList.remove('opacity-75', 'cursor-not-allowed');
            }
        });

        // ==========================================
        // 🔄 ระบบ GET (ดึงข้อมูลแสดง Dashboard)
        // ==========================================
        const dashboardModal = document.getElementById('dashboardModal');

        function toggleDashboard() {
            if (dashboardModal.classList.contains('hidden')) {
                dashboardModal.classList.remove('hidden');
                fetchDashboardData(); 
            } else { dashboardModal.classList.add('hidden'); }
        }
        dashboardModal.addEventListener('click', (e) => { if(e.target === dashboardModal) toggleDashboard(); });

        async function fetchDashboardData(forceUpdate = false) {
            const loadingUI = document.getElementById('loadingOverlay');
            
            // ใช้ Cache เก่าก่อนเพื่อให้หน้าจอไม่ว่างเปล่า
            const localData = JSON.parse(localStorage.getItem(STORAGE_KEY));
            if (localData && !forceUpdate) renderDashboardUI(localData);
            
            loadingUI.classList.remove('hidden');
            
            try {
                // เจาะทะลุ Cache มือถือ ด้วยการแนบ Timestamp
                const fetchUrl = `${GOOGLE_SCRIPT_URL}?action=getData&t=${new Date().getTime()}`;
                const response = await fetch(fetchUrl);
                const result = await response.json();
                
                if (result.result === 'success') {
                    renderDashboardUI(result.data);
                    localStorage.setItem(STORAGE_KEY, JSON.stringify(result.data));
                } else { throw new Error(result.message); }
            } catch (error) {
                console.error('Fetch Error:', error);
                if (forceUpdate) showToast('ไม่สามารถดึงข้อมูลล่าสุดได้', 'error');
            } finally {
                loadingUI.classList.add('hidden');
            }
        }

        function renderDashboardUI(envelopes) {
            let totalAmount = 0, groomAmount = 0, brideAmount = 0, groomCount = 0, brideCount = 0;
            const tableBody = document.getElementById('guestListTable');
            const emptyState = document.getElementById('emptyState');
            
            tableBody.innerHTML = '';

            if (!envelopes || envelopes.length === 0) {
                emptyState.classList.remove('hidden');
                document.getElementById('totalAmount').innerText = '0'; document.getElementById('totalCount').innerText = '0 ซอง';
                document.getElementById('groomAmount').innerText = '0'; document.getElementById('groomCount').innerText = '0 ซอง';
                document.getElementById('brideAmount').innerText = '0'; document.getElementById('brideCount').innerText = '0 ซอง';
                return;
            }
            
            emptyState.classList.add('hidden');
            
            envelopes.forEach(env => {
                const amount = parseFloat(env.amount) || 0;
                totalAmount += amount;
                if (env.side === 'เจ้าบ่าว') { groomAmount += amount; groomCount++; } 
                else if (env.side === 'เจ้าสาว') { brideAmount += amount; brideCount++; }

                let sideBadge = env.side === 'เจ้าบ่าว' ? '<span class="bg-blue-50 text-blue-600 border border-blue-100 px-2.5 py-1 rounded-lg text-xs font-medium">เจ้าบ่าว</span>' : 
                                env.side === 'เจ้าสาว' ? '<span class="bg-rose-50 text-rose-600 border border-rose-100 px-2.5 py-1 rounded-lg text-xs font-medium">เจ้าสาว</span>' : 
                                '<span class="bg-purple-50 text-purple-600 border border-purple-100 px-2.5 py-1 rounded-lg text-xs font-medium">ทั้งคู่</span>';

                tableBody.innerHTML += `
                    <tr class="hover:bg-pink-50/50 transition-colors">
                        <td class="px-5 py-4 text-xs text-gray-500">${env.timestamp || '-'}</td>
                        <td class="px-5 py-4 font-medium text-gray-800">${env.name} ${env.note ? `<span class="text-xs text-gray-400 block font-normal mt-1"><i class="fa-regular fa-comment-dots text-pink-300"></i> ${env.note}</span>` : ''}</td>
                        <td class="px-5 py-4 text-right font-bold text-pink-600">${amount.toLocaleString()}</td>
                        <td class="px-5 py-4 text-center text-gray-500 text-xs">${env.type}</td>
                        <td class="px-5 py-4 text-center">${sideBadge}</td>
                    </tr>
                `;
            });

            document.getElementById('totalAmount').innerText = totalAmount.toLocaleString(); document.getElementById('totalCount').innerText = `${envelopes.length} ซอง`;
            document.getElementById('groomAmount').innerText = groomAmount.toLocaleString(); document.getElementById('groomCount').innerText = `${groomCount} ซอง`;
            document.getElementById('brideAmount').innerText = brideAmount.toLocaleString(); document.getElementById('brideCount').innerText = `${brideCount} ซอง`;
        }

        window.onload = () => nameInput.focus();
    </script>
</body>
</html>
